[versions]
agp = "9.4.1"
kotlin = "2.2.10"
ksp = "2.3.12"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.02.01"
nav3 = "1.0.1"
orbit = "10.0.0"
hilt = "2.60.1"
hiltAndroidx = "1.3.0"
room = "2.8.4"
retrofit = "3.0.0"
okhttp = "5.2.1"
serialization = "1.9.0"
coroutines = "1.10.2"
datastore = "1.2.0"
paging = "3.4.0"
work = "2.11.0"
coil = "3.4.0"
media3 = "1.9.0"
splashscreen = "1.2.0"
firebaseBom = "34.4.0"
googleServices = "4.4.4"
javaxInject = "1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# --- AndroidX core ---
# Kotlin extensions for Android APIs
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# setContent { } — hosts Compose inside an Activity
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# collectAsStateWithLifecycle, lifecycle-aware Compose
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# viewModel() inside Compose
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Per-entry ViewModel scope for Navigation 3
androidx-lifecycle-viewmodel-nav3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
# Android 12+ system splash screen API
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# --- Compose ---
# Aligns versions of all Compose libraries
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Compose UI core
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Drawing, colors, gradients
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
# Layout inspector / preview rendering (debug only)
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# @Preview annotation
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Test activity manifest for Compose UI tests
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Compose UI testing (JUnit4 rules)
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Material Design 3 components
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Full Material icons set
androidx-compose-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Navigation 3 ---
# NavKey, back stack, entryProvider
nav3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
# NavDisplay — renders entries with transitions
nav3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }

# --- MVI ---
# ContainerHost, intent, reduce, postSideEffect
orbit-viewmodel = { group = "org.orbit-mvi", name = "orbit-viewmodel", version.ref = "orbit" }
# collectAsState() / collectSideEffect() for Compose
orbit-compose = { group = "org.orbit-mvi", name = "orbit-compose", version.ref = "orbit" }

# --- Dependency injection ---
# Hilt runtime
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Hilt code generator (KSP)
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# hiltViewModel() in Compose
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltAndroidx" }
# Injection into WorkManager workers
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltAndroidx" }
# Code generator for hilt-work
hilt-androidx-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltAndroidx" }
# @Inject annotation for pure-Kotlin modules (domain)
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

# --- Network ---
# Type-safe REST client
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# Retrofit converter using kotlinx.serialization
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
# HTTP + WebSocket client
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Logs requests/responses to Logcat
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# --- Kotlin ---
# Coroutines and Flow
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Dispatchers.Main for Android
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# runTest, test dispatchers
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# JSON encoding/decoding
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- Local data ---
# SQLite ORM
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# suspend + Flow support for Room
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# PagingSource straight from Room queries
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
# Generates DAO/Entity code (KSP)
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Key-value storage (tokens, settings), replaces SharedPreferences
androidx-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# Paged loading
paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
# collectAsLazyPagingItems() for Compose
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
# Background work that survives app exit
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# --- Media ---
# Image loading + caching, AsyncImage
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Coil network layer on OkHttp (auth headers)
coil-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# Video/audio player
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
# ExoPlayer streaming via OkHttp (auth headers, Range)
media3-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
# Player UI in Compose
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

# --- Push ---
# Aligns Firebase library versions
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
# FCM push notifications
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# --- Test ---
# JVM unit tests (src/test)
junit = { group = "junit", name = "junit", version.ref = "junit" }
# JUnit runner for on-device tests (src/androidTest)
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
# View-based UI tests (rarely needed with Compose)
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
# Android app module
android-application = { id = "com.android.application", version.ref = "agp" }
# Android library module
android-library = { id = "com.android.library", version.ref = "agp" }
# Pure Kotlin/JVM module
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose compiler
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# @Serializable code generation
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Kotlin Symbol Processing (faster kapt replacement)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Hilt Gradle plugin
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# Room Gradle plugin (schema directory)
room = { id = "androidx.room", version.ref = "room" }
# Reads google-services.json for Firebase
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
